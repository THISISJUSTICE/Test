<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UML Diagrams</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 1300px; margin: 36px auto; padding: 0 22px; }
    h1 { margin-bottom: 24px; }
    section { margin: 0 0 38px; }
    details.group { margin: 18px 0 26px; border: 1px solid #a3a3a3; border-radius: 10px; padding: 12px 16px; }
    details.group > summary { cursor: pointer; font-size: 1.3rem; font-weight: 700; padding: 4px 0; }
    details.group > summary .count { font-size: .85rem; font-weight: 400; opacity: .65; margin-left: 8px; }
    .group-content { padding: 18px 2px 0; }
    .group-content section:last-child { margin-bottom: 8px; }
    h2 { font-size: 1.35rem; margin: 0 0 12px; overflow-wrap: anywhere; }
    .mxgraph { border: 1px solid #d1d5db; border-radius: 8px; min-height: 320px; overflow: hidden; background: #ffffff; color: #111111; color-scheme: light; }
    .message { color: #888; }
    .diagram-refs { margin: 12px 0 0; font-size: .93rem; }
    .diagram-refs strong { margin-right: 8px; }
    .diagram-refs a { display: inline-block; margin: 0 10px 5px 0; }
    section:target { scroll-margin-top: 16px; outline: 2px solid #93c5fd; outline-offset: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>UML Diagrams</h1>
  <main id="diagrams"><p class="message">다이어그램을 불러오는 중입니다...</p></main>
  <script>
    (async function () {
      const container = document.getElementById('diagrams');
      try {
        const manifestUrl = new URL('./Docs/diagrams.json', document.baseURI);
        const response = await fetch(manifestUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`목록 조회 실패 (HTTP ${response.status})`);
        const manifest = await response.json();
        const versions = manifest.versions || {};
        const references = manifest.references || {};
        const sectionByFile = new Map();
        const files = [...new Set(manifest.diagrams || [])]
          .filter(path => typeof path === 'string' && /\.drawio$/i.test(path))
          .sort((a, b) => a.localeCompare(b, 'ko'));
        container.replaceChildren();
        if (!files.length) {
          container.innerHTML = '<p class="message">표시할 다이어그램이 없습니다.</p>';
          return;
        }
        // Group by directory relative to Docs. Root-level files remain in "Other".
        // Compute from paths for compatibility with older diagrams.json manifests.
        const groups = new Map();
        for (const file of files) {
          const relative = file.replace(/^Docs\//i, '');
          const slash = relative.lastIndexOf('/');
          const group = slash < 0 ? '' : relative.slice(0, slash);
          if (!groups.has(group)) groups.set(group, []);
          groups.get(group).push(file);
        }
        const orderedGroups = [...groups.keys()].sort((a, b) => {
          if (!a) return 1;
          if (!b) return -1;
          return a.localeCompare(b, 'ko');
        });
        for (const groupName of orderedGroups) {
          const groupFiles = groups.get(groupName);
          const details = document.createElement('details');
          details.className = 'group';
          details.open = true;
          const summary = document.createElement('summary');
          summary.append(document.createTextNode(groupName || 'Other'));
          const count = document.createElement('span');
          count.className = 'count';
          count.textContent = `${groupFiles.length} diagrams`;
          summary.append(count);
          details.append(summary);
          const content = document.createElement('div');
          content.className = 'group-content';
          for (const file of groupFiles) {
            const title = file.split('/').pop().replace(/\.drawio$/i, '');
            const section = document.createElement('section');
            section.id = 'diagram-' + encodeURIComponent(file); 
            sectionByFile.set(file, { section, details });
            const heading = document.createElement('h2');
            heading.textContent = title;
            const diagram = document.createElement('div');
            diagram.className = 'mxgraph';
            const url = new URL(file, document.baseURI);
            url.searchParams.set('v', versions[file] || Date.now().toString());
            diagram.setAttribute('data-mxgraph', JSON.stringify({
              url: url.href,
              nav: true,
              background: '#ffffff',
              resize: true,
              toolbar: 'zoom layers lightbox',
              edit: '_blank'
            }));
            section.append(heading, diagram);
            const linked = [...new Set(references[file] || [])].filter(path => files.includes(path) && path !== file);
            if (linked.length) {
              const refs = document.createElement('nav');
              refs.className = 'diagram-refs';
              const label = document.createElement('strong');
              label.textContent = '참조 다이어그램:';
              refs.append(label);
              for (const target of linked) {
                const link = document.createElement('a');
                link.href = '#diagram-' + encodeURIComponent(target);
                link.textContent = target.replace(/^Docs\//i, '').replace(/\.drawio$/i, '');
                refs.append(link);
              }
              section.append(refs);
            }
            content.append(section);
          }
          details.append(content);
          container.append(details);
        }
        // Open the target group before scrolling to a linked diagram.
        const navigateToHash = () => {
          const prefix = '#diagram-';
          if (!location.hash.startsWith(prefix)) return;
          let file;
          try { file = decodeURIComponent(location.hash.slice(prefix.length)); }
          catch { return; }
          const target = sectionByFile.get(file);
          if (!target) return;
          target.details.open = true;
          target.section.scrollIntoView({ block: 'start' });
        };
        window.addEventListener('hashchange', navigateToHash);
        navigateToHash();
        const script = document.createElement('script');
        script.src = 'https://viewer.diagrams.net/js/viewer-static.min.js';
        script.onerror = () => { container.insertAdjacentHTML('afterbegin', '<p class="message">draw.io 뷰어를 불러오지 못했습니다.</p>'); };
        document.body.append(script);
      } catch (error) {
        container.textContent = `다이어그램을 불러오지 못했습니다: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
