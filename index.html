<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UML Diagrams</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 1300px; margin: 36px auto; padding: 0 22px; }
    h1 { margin-bottom: 24px; }
    section { margin: 0 0 38px; }
    h2 { font-size: 1.35rem; margin: 0 0 12px; overflow-wrap: anywhere; }
    .mxgraph { border: 1px solid #bbb6; border-radius: 8px; min-height: 320px; overflow: hidden; }
    .message { color: #888; }
  </style>
</head>
<body>
  <h1>UML Diagrams</h1>
  <main id="diagrams"><p class="message">다이어그램을 불러오는 중입니다...</p></main>
  <script>
    (async function () {
      const container = document.getElementById('diagrams');
      try {
        const manifestUrl = new URL('./Docs/diagrams.json', document.baseURI);
        const response = await fetch(manifestUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`목록 조회 실패 (HTTP ${response.status})`);
        const manifest = await response.json();
        const files = [...new Set(manifest.diagrams || [])]
          .filter(path => typeof path === 'string' && /\.drawio$/i.test(path))
          .sort((a, b) => a.localeCompare(b, 'ko'));
        container.replaceChildren();
        if (!files.length) {
          container.innerHTML = '<p class="message">표시할 다이어그램이 없습니다.</p>';
          return;
        }
        for (const file of files) {
          const title = file.split('/').pop().replace(/\.drawio$/i, '');
          const section = document.createElement('section');
          const heading = document.createElement('h2');
          heading.textContent = title;
          const diagram = document.createElement('div');
          diagram.className = 'mxgraph';
          const url = new URL(file, document.baseURI);
          url.searchParams.set('v', Date.now().toString());
          diagram.setAttribute('data-mxgraph', JSON.stringify({
            url: url.href,
            nav: true,
            resize: true,
            toolbar: 'zoom layers lightbox',
            edit: '_blank'
          }));
          section.append(heading, diagram);
          container.append(section);
        }
        const script = document.createElement('script');
        script.src = 'https://viewer.diagrams.net/js/viewer-static.min.js';
        script.onerror = () => { container.insertAdjacentHTML('afterbegin', '<p class="message">draw.io 뷰어를 불러오지 못했습니다.</p>'); };
        document.body.append(script);
      } catch (error) {
        container.textContent = `다이어그램을 불러오지 못했습니다: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
